name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Fast pre-commit checks (same as local, but on CI)
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Pixi
      uses: prefix-dev/setup-pixi@v0.8.0

    - name: Install dependencies
      run: pixi install

    - name: Run pre-commit checks
      run: pixi run pre-commit run --all-files

  # Fast testing and validation
  test-and-validate:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Pixi
      uses: prefix-dev/setup-pixi@v0.8.0

    - name: Install dependencies
      run: pixi install

    - name: Validate project structure
      run: |
        # Check for required files
        test -f README.md && echo "PASS: README.md exists"
        test -f pixi.toml && echo "PASS: pixi.toml exists"
        test -f .pre-commit-config.yaml && echo "PASS: pre-commit config exists"

        # Check for required directories
        test -d scripts && echo "PASS: scripts/ directory exists"
        test -d tests && echo "PASS: tests/ directory exists"
        test -d data && echo "PASS: data/ directory exists"

    - name: Run SeqKit subsampling specification tests
      run: |
        # Test SeqKit subsampling specification validation
        # Note: This test validates existing specifications, not data generation
        pixi run Rscript tests/test_seqkit_subsampling_specs.R
