# Pre-commit configuration for pipeline_benchmarking
# Fast, local checks that run before each commit

repos:
  - repo: local
    hooks:
      - id: style-files
        name: style-files
        entry: pixi run Rscript scripts/precommit_hooks/style-files.R
        language: system
        pass_filenames: true
        files: '(\.[rR]profile|\.[rR]|\.Rmd|\.rmd|\.Rnw|\.qmd)$'
        exclude: >
          (?x)^(
          tests/testthat/in/.*|
          data/.*\.(csv|tsv|json|fastq|gz|txt|pdf|png|jpg|jpeg)$|
          data/.*/cache/.*|
          data/.*/syn_specs/.*|
          results/.*|
          figures/.*|
          logs/.*|
          )$

      - id: parsable-R
        name: parsable-R
        entry: pixi run Rscript scripts/precommit_hooks/parsable-R.R
        language: system
        pass_filenames: true
        files: '\.[rR](md)?$'
        exclude: >
          (?x)^(
          tests/testthat/in/.*|
          data/.*\.(csv|tsv|json|fastq|gz|txt|pdf|png|jpg|jpeg)$|
          data/.*/cache/.*|
          data/.*/syn_specs/.*|
          results/.*|
          figures/.*|
          logs/.*|
          )$

      - id: lintr
        name: lintr
        entry: pixi run Rscript scripts/precommit_hooks/lintr.R
        language: system
        pass_filenames: true
        files: '(\.[rR]profile|\.R|\.Rmd|\.Rnw|\.qmd)$'
        exclude: 'renv/activate\.R'

      - id: no-browser-statement
        name: no-browser-statement
        entry: pixi run Rscript scripts/precommit_hooks/no-browser-statement.R
        language: system
        pass_filenames: true
        files: '\.[rR]$'
        exclude: >
          (?x)^(
          scripts/precommit_hooks/.*|
          tests/testthat/in/.*|
          )$

      - id: no-debug-statement
        name: no-debug-statement
        entry: pixi run Rscript scripts/precommit_hooks/no-debug-statement.R
        language: system
        pass_filenames: true
        files: '\.[rR]$'
        exclude: >
          (?x)^(
          scripts/precommit_hooks/.*|
          tests/testthat/in/.*|
          )$

      - id: spell-check
        name: spell-check
        entry: pixi run Rscript scripts/precommit_hooks/spell-check.R
        language: system
        pass_filenames: true
        exclude: >
          (?x)^(
          (.*/|)NAMESPACE|
          (.*/|)renv/settings\.dcf|
          (.*/|)renv\.lock|
          (.*/|)pixi\.lock|
          (.*/|)pyproject\.toml|
          (.*/|)\.gitattributes|
          (.*/|)\.gitignore|
          (.*/|)\.dvcignore|
          .*\.dvc$|
          .*\.RData|
          .*\.Rds|
          .*\.Rproj|
          .*\.[rR]|
          .*\.feather|
          .*\.jpeg|
          .*\.pdf|
          .*\.png|
          .*\.py|
          .*\.rds|
          .*\.sh|
          .*\.yml|
          .*\.yaml|
          LICENSE|
          \.github/workflows/.*|
          data/.*\.(csv|tsv|json|fastq|gz|txt|pdf|png|jpg|jpeg)$|
          data/.*/cache/.*|
          data/.*/syn_specs/.*|
          results/.*|
          figures/.*|
          logs/.*|
          inst/hooks/.*|
          inst/pre-commit-.*|
          inst/usethis-legacy-hook|
          renv/.*|
          revdep/.*|
          tests/testthat/in/.*|
          )$

      - id: trailing-whitespace
        name: trailing-whitespace
        entry: pixi run Rscript scripts/precommit_hooks/trailing-whitespace.R
        language: system
        pass_filenames: true
        exclude: >
          (?x)^(
          data/.*\.(csv|tsv|json|fastq|gz|txt|pdf|png|jpg|jpeg)$|
          data/.*/cache/.*|
          data/.*/syn_specs/.*|
          results/.*|
          figures/.*|
          logs/.*|
          renv/.*|
          pixi\.lock|
          )$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # File formatting and structure (fast, local)
      - id: end-of-file-fixer
        exclude: '\.Rd' # sometimes roxygen fails to generate EOF blank line.
      - id: check-toml
      - id: check-yaml
      # File size checks (Prevents large files from being committed)
      - id: check-added-large-files
        args: ['--maxkb=1000']
      # Merge conflict checks (Prevents merge conflicts from being committed)
      - id: check-merge-conflict
      # Case conflict checks (Prevents commiting files that differ only by letter case)
      - id: check-case-conflict
      # Script hygiene checks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

# Hook execution order
fail_fast: true  # Stop on first failure for faster feedback
