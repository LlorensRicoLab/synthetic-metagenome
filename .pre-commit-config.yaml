# Pre-commit configuration for pipeline_benchmarking
# Fast, local checks that run before each commit

repos:
  # R-specific hooks from lorenzwalthert/precommit
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3.9011
    hooks:
      # R code formatting (fast, local)
      - id: style-files
        args: [--style_pkg=styler, --style_fun=tidyverse_style, --cache-root=styler-perm]
        exclude: >
          (?x)^(
          tests/testthat/in/.*|
          data/.*\.(csv|tsv|json|fastq|gz|txt|pdf|png|jpg|jpeg)$|
          data/.*/cache/.*|
          data/.*/syn_specs/.*|
          results/.*|
          figures/.*|
          logs/.*|
          )$

      # R syntax checking (fast, local)
      - id: parsable-R
        exclude: >
          (?x)^(
          tests/testthat/in/.*|
          data/.*\.(csv|tsv|json|fastq|gz|txt|pdf|png|jpg|jpeg)$|
          data/.*/cache/.*|
          data/.*/syn_specs/.*|
          results/.*|
          figures/.*|
          logs/.*|
          )$

      # R code linting (fast, local)
      - id: lintr
        exclude: >
          (?x)^(
          tests/testthat/in/.*|
          data/.*\.(csv|tsv|json|fastq|gz|txt|pdf|png|jpg|jpeg)$|
          data/.*/cache/.*|
          data/.*/syn_specs/.*|
          results/.*|
          figures/.*|
          logs/.*|
          )$

      # Code quality checks (fast, local)
      - id: no-browser-statement
        exclude: >
          (?x)^(
          tests/testthat/in/.*|
          )$

      - id: no-debug-statement
        exclude: >
          (?x)^(
          tests/testthat/in/.*|
          )$

      # Spell checking (with comprehensive exclusions)
      - id: spell-check
        exclude: >
          (?x)^(
          (.*/|)NAMESPACE|m
          (.*/|)renv/settings\.dcf|
          (.*/|)renv\.lock|
          (.*/|)pixi\.lock|
          (.*/|)pyproject\.toml|
          (.*/|)\.gitattributes|
          (.*/|)\.gitignore|
          (.*/|)\.dvcignore|
          .*\.dvc$|
          .*\.RData|
          .*\.Rds|
          .*\.Rproj|
          .*\.[rR]|
          .*\.feather|
          .*\.jpeg|
          .*\.pdf|
          .*\.png|
          .*\.py|
          .*\.rds|
          .*\.sh|
          .*\.yml|
          .*\.yaml|
          LICENSE|
          \.github/workflows/.*|
          data/.*\.(csv|tsv|json|fastq|gz|txt|pdf|png|jpg|jpeg)$|
          data/.*/cache/.*|
          data/.*/syn_specs/.*|
          results/.*|
          figures/.*|
          logs/.*|
          inst/hooks/.*|
          inst/pre-commit-.*|
          inst/usethis-legacy-hook|
          renv/.*|
          revdep/.*|
          tests/testthat/in/.*|
          )$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # File formatting and structure (fast, local)
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '\.Rd' # sometimes roxygen fails to generate EOF blank line.
      - id: check-toml
      - id: check-yaml
      # File size checks (Prevents large files from being committed)
      - id: check-added-large-files
        args: ['--maxkb=1000']
      # Merge conflict checks (Prevents merge conflicts from being committed)
      - id: check-merge-conflict
      # Case conflict checks (Prevents commiting files that differ only by letter case)
      - id: check-case-conflict
      # Script hygiene checks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

# Hook execution order
fail_fast: true  # Stop on first failure for faster feedback
